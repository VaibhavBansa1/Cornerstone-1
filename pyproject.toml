[project]
name = "mits-it-rag"
version = "0.1.0"
description = "Scope-limited scraper + RAG pipeline for the MITS Gwalior IT department site"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-generativeai>=0.8"]
# Ollama needs no extra package beyond the core `requests` dependency.
all = ["anthropic>=0.40", "openai>=1.40", "google-generativeai>=0.8"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
