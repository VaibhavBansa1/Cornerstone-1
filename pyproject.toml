[project]
name = "mits-it-rag"
version = "0.1.0"
description = "Scope-limited scraper + RAG pipeline for the MITS Gwalior IT department site"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "flask>=3.0",
]

[project.optional-dependencies]
# LLM providers need no extra packages: they are all called over plain HTTP
# with `requests` (see rag/llm/).
#
# Pick ONE PyTorch build (they are alternatives, see [tool.uv] conflicts):
#   laptop / no NVIDIA GPU:   uv sync --extra cpu --extra ocr        (~200 MB torch)
#   NVIDIA GPU PC:            uv sync --extra cuda --extra ocr       (~2.5 GB torch)
cpu = ["torch>=2.6", "torchvision>=0.21"]
cuda = ["torch>=2.6", "torchvision>=0.21"]
# Read scanned PDFs (OCR): EasyOCR (fast on GPU) + RapidOCR (CPU fallback).
ocr = ["easyocr>=1.7", "rapidocr-onnxruntime>=1.4", "pypdfium2>=4.30"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
