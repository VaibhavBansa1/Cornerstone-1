[project]
name = "mits-it-rag"
version = "0.1.0"
description = "Scope-limited scraper + RAG pipeline for the MITS Gwalior IT department site"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=4.0",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "flask>=3.0",
]

[project.optional-dependencies]
# LLM providers need no extra packages: they are all called over plain HTTP
# with `requests` (see rag/llm/).
#
# GPU embeddings on an NVIDIA card:   uv sync --extra cuda
# Plain `uv sync` installs the normal CPU build (fine for a laptop).
cuda = ["torch>=2.6"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
