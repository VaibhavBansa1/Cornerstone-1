<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Desk Admin</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <div class="logo">IT</div>
  <div>
    <h1>Admin Dashboard</h1>
    <div class="sub">Manage documents and see what students are asking</div>
  </div>
  <div class="right"><a href="/">Back to chat</a></div>
</div>
<div class="admin">
  <div class="grid">
    <div class="card stat"><div class="num" id="nDocs">-</div><div class="lbl">Sources indexed</div></div>
    <div class="card stat"><div class="num" id="nQs">-</div><div class="lbl">Questions asked</div></div>
    <div class="card stat"><div class="num" id="avgMs">-</div><div class="lbl">Avg. response time</div></div>
  </div>

  <div class="two">
    <div class="card">
      <h3>Indexed documents</h3>
      <input class="filter" id="filter" placeholder="Filter by name or type...">
      <div class="tablebox">
        <table>
          <thead><tr><th>Name</th><th>Type</th><th>Chunks</th><th></th></tr></thead>
          <tbody id="docs"></tbody>
        </table>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:12px">
        <h3>Upload a document</h3>
        <div class="drop" id="drop">Drag a PDF / DOCX / TXT here<br>or click to choose</div>
        <input type="file" id="file" accept=".pdf,.docx,.txt" hidden>
        <div class="field">
          <input type="password" id="pw" placeholder="Admin password">
          <button class="btn" id="upBtn">Upload</button>
        </div>
        <div class="msgline" id="upMsg"></div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <h3>Most referenced sources</h3>
        <ul class="plain" id="topSrc"></ul>
      </div>
      <div class="card">
        <h3>Recent questions</h3>
        <ul class="plain" id="recent"></ul>
      </div>
    </div>
  </div>
</div>
<script src="/static/admin.js"></script>
</body>
</html>
